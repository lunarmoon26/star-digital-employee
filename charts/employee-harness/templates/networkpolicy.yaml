apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.employeeName }}-harness-default-deny
  labels:
    app.kubernetes.io/name: employee-harness
    app.kubernetes.io/instance: {{ .Values.employeeName }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: employee-harness
      app.kubernetes.io/instance: {{ .Values.employeeName }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or .Values.networkPolicy.ingressAllowNamespace .Values.networkPolicy.egressAllows }}
  ingress:
    {{- if .Values.networkPolicy.ingressAllowNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressAllowNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.web.port }}
    {{- end }}
  egress:
    {{- range .Values.networkPolicy.egressAllows }}
    - to:
        {{- if .namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
        {{- end }}
        {{- if .podSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
        {{- end }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
  {{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.employeeName }}-harness
  labels:
    app.kubernetes.io/name: employee-harness
    app.kubernetes.io/instance: {{ .Values.employeeName }}
spec:
  # ClusterIP only; the Web surface is reached through the organization
  # authentication proxy, never exposed directly.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: employee-harness
    app.kubernetes.io/instance: {{ .Values.employeeName }}
  ports:
{{- if .Values.webProxy.enabled }}
    # The authentication-proxy sidecar is the only published port (ADR 0010);
    # the Harness web port stays loopback-only inside the pod.
    - name: proxy
      port: {{ .Values.webProxy.port }}
      targetPort: proxy
{{- else }}
    - name: web
      port: {{ .Values.web.port }}
      targetPort: web
{{- end }}

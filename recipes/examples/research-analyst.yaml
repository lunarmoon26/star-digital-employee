apiVersion: star.employee/v1alpha1
kind: Employee

metadata:
  name: research-analyst
  labels:
    team: research

spec:
  identity:
    supervisorGroup: analysts
    serviceAccount: research-analyst

  harness:
    package: "@deepseek-ai/dsh"
    version: 0.1.1-rc.2
    profile: employee-web

  runtime:
    baseImage: node:24-bookworm-slim
    systemPackages:
      - name: ca-certificates
      - name: git
      - name: openssh-client
      - name: ripgrep
    cliPackages: []
    environment:
      LOG_LEVEL:
        target: supervisor
        valueFrom:
          nonSecretConfigRef: employee-settings
          key: LOG_LEVEL
    controlPod:
      cpu: "1"
      memory: 2Gi

  model:
    gatewayRef: organization-model-gateway
    default: deepseek/deepseek-chat
    budget:
      monthlyUsd: 500

  persona:
    instructions: ./persona/research-analyst.md

  skills:
    - source: ../../plugins/researcher/skills/research-methodology

  connectors:
    slack:
      accountRef: slack-research
    googleWorkspace:
      accountRef: google-research

  tools:
    defaultPolicy: read-only
    allow:
      - wiki.search
      - mail.read
      - mail.draft
    requireApproval:
      - mail.send
      - code.publish

  execution:
    defaultProfile: light
    profiles:
      light:
        provider: local
        cpu: "1"
        memory: 2Gi
      development:
        provider: kubernetes
        cpu: "8"
        memory: 16Gi
        approval: supervisor
        idleTimeoutMinutes: 30
      development-large:
        provider: kubernetes
        cpu: "16"
        memory: 64Gi
        approval: supervisor
        idleTimeoutMinutes: 30

  memory:
    volumeSize: 20Gi
    retentionDays: 365

  observability:
    audit: required
    contentCapture: false
